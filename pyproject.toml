[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit-scanner"
version = "1.0.0"
description = "🛡️ Static analysis CLI tool for auditing Model Context Protocol (MCP) servers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Varun Ruhella" }]
keywords = ["ai", "security", "mcp", "audit", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-audit = "mcp_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/varungor365/mcp-audit-scanner"
Repository = "https://github.com/varungor365/mcp-audit-scanner"
